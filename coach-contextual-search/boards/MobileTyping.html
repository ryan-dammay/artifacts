<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COACH mobile search · typing, query understood</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#555555}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.caret{display:inline-block;width:1px;height:17px;background:#111111;margin-left:2px;animation:caretblink 1s steps(1) infinite}
@keyframes caretblink{50%{opacity:0}}
@keyframes sheetin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sheet{animation:sheetin 220ms cubic-bezier(.2,.7,.2,1)}
.tip{transition:opacity 360ms ease, transform 360ms cubic-bezier(.2,.7,.2,1)}
.hscroll{scrollbar-width:none}.hscroll::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion: reduce){.caret,.sheet{animation:none}.tip{transition:opacity 200ms linear;transform:none !important}}
</style>
<style>html{background:#E9E9E9}body{margin:0}#stage{width:375px;margin:0 auto}#root{width:375px;height:812px;background:#FFFFFF;box-shadow:0 0 0 1px rgba(0,0,0,.06)}</style>
</head>
<body>
<div id="stage"><div id="root"></div></div>
<template id="tpl">
<div style="width: 375px; height: 812px; position: relative; overflow: hidden; background: #FFFFFF; color: #111111; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif">

  <div style="background: #000000; color: #FFFFFF; font-size: 10px; letter-spacing: 0.1em; text-align: center; height: 36px; display: flex; align-items: center; justify-content: center">BUY NOW, PAY LATER WITH TABBY &amp; TAMARA</div>
  <header style="height: 72px; box-sizing: border-box; padding: 0 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; border-bottom: 1px solid #E5E5E5">
    <div style="display: flex; align-items: center">
      <button type="button" aria-label="Menu" style="width: 44px; height: 44px; margin-left: -10px; border: 0; background: none; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <a href="#" aria-label="Stores" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.4" aria-hidden="true"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg></a>
    </div>
    <a href="#" aria-label="COACH home" style="display: block; line-height: 0"><img src="../assets/coach-logo.png" alt="COACH" style="width: 114px; height: 13.0px; display: block"></a>
    <div style="display: flex; align-items: center; justify-content: flex-end">
      <button type="button" aria-label="Search" aria-haspopup="dialog" onClick="{{openSearch}}" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/><path d="M10.5 7.2c.25 1.65 1 2.4 2.65 2.65-1.65.25-2.4 1-2.65 2.65-.25-1.65-1-2.4-2.65-2.65 1.65-.25 2.4-1 2.65-2.65z" fill="#111111" stroke-width="0.8"/></svg></button>
      <a href="#" aria-label="Bag" style="width: 44px; height: 44px; margin-right: -10px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.4" aria-hidden="true"><path d="M5 8h14l-1 13H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></a>
    </div>
  </header>

  <main style="display: flex; flex-direction: column; align-items: center">
    <h1 style="margin: 28px 0 20px; font-size: 34px; font-weight: 700">Sale</h1>
    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center">
      <a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1px solid #111111; text-decoration: none; font-size: 13px; letter-spacing: 0.04em">Shop Women’s</a>
      <a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1px solid #111111; text-decoration: none; font-size: 13px; letter-spacing: 0.04em">Shop Men’s</a>
    </div>
    <div style="margin-top: 28px; width: 100%; height: 420px; background: #EDE6E0; display: flex; align-items: center; justify-content: center; color: #6B6259; font-size: 13px">[Campaign image]</div>
  </main>

  <sc-if value="{{tipMounted}}" hint-placeholder-val="{{ false }}">
    <div role="status" aria-live="polite" class="tip" style="position: absolute; top: 118px; left: 83px; width: 280px; box-sizing: border-box; background: #111111; color: #FFFFFF; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; z-index: 3; opacity: {{tipOpacity}}; transform: {{tipTransform}}; pointer-events: {{tipPointer}}">
      <div aria-hidden="true" style="position: absolute; top: -6px; left: 204px; width: 12px; height: 12px; background: #111111; transform: rotate(45deg)"></div>
      <p style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M10 3c.6 3.9 2.6 5.9 6.5 6.5-3.9.6-5.9 2.6-6.5 6.5-.6-3.9-2.6-5.9-6.5-6.5C7.4 8.9 9.4 6.9 10 3z"/><path d="M18.5 14.5c.3 1.8 1.2 2.7 3 3-1.8.3-2.7 1.2-3 3-.3-1.8-1.2-2.7-3-3 1.8-.3 2.7-1.2 3-3z"/></svg>New · Contextual search</p>
      <p style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 16px; line-height: 22px">Search the way you’d describe it: a style, occasion, colour or budget.</p>
      <button type="button" onClick="{{dismissTip}}" style="align-self: flex-start; min-height: 32px; border: 0; background: none; color: #FFFFFF; padding: 0; font-family: inherit; font-size: 13px; letter-spacing: 0.06em; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Got it</button>
    </div>
  </sc-if>

  <sc-if value="{{isOpen}}" hint-placeholder-val="{{ true }}">
    <div role="dialog" aria-label="Search" class="sheet" style="position: absolute; inset: 0; background: #FFFFFF; z-index: 5; display: flex; flex-direction: column">
      <div style="padding: 14px 16px 0; display: flex; align-items: center; gap: 12px">
        <form role="search" onSubmit="{{submit}}" style="flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 8px; border-bottom: 2px solid #111111; padding: 8px 0 7px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 3px"><path d="M10 3c.6 3.9 2.6 5.9 6.5 6.5-3.9.6-5.9 2.6-6.5 6.5-.6-3.9-2.6-5.9-6.5-6.5C7.4 8.9 9.4 6.9 10 3z"/><path d="M18.5 14.5c.3 1.8 1.2 2.7 3 3-1.8.3-2.7 1.2-3 3-.3-1.8-1.2-2.7-3-3 1.8-.3 2.7-1.2 3-3z"/></svg>
          <label for="mq" class="sr">Search</label>
          <div style="flex: 1; min-width: 0; display: grid; align-items: start">
            <input id="mq" ref="{{inputRef}}" value="{{val}}" onChange="{{onType}}" onKeyDown="{{onKey}}" autocomplete="off" enterkeyhint="search" aria-description="Search by style, occasion, colour or budget" style="grid-area: 1 / 1; width: 100%; height: 22px; line-height: 22px; border: 0; outline: 0; padding: 0; background: transparent; font-family: 'Cormorant Garamond', serif; font-size: 17px; color: #111111; caret-color: {{caretColor}}">
            <sc-if value="{{empty}}" hint-placeholder-val="{{ true }}">
              <span aria-hidden="true" style="grid-area: 1 / 1; display: flex; align-items: center; height: 22px; pointer-events: none; white-space: nowrap; overflow: hidden; font-family: 'Cormorant Garamond', serif; font-size: 16px; color: #949494"><span class="caret" style="margin: 0 3px 0 0; flex: none"></span><span style="overflow: hidden; text-overflow: ellipsis">Search the way you’d describe it</span></span>
            </sc-if>
          </div>
          <sc-if value="{{hasVal}}" hint-placeholder-val="{{ false }}">
            <button type="button" aria-label="Clear search" onClick="{{clear}}" style="margin-top: -5px; width: 32px; height: 32px; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#595959" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          </sc-if>
          <button type="submit" aria-label="Search" style="margin-top: -5px; width: 32px; height: 32px; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
        </form>
        <button type="button" onClick="{{closeSearch}}" style="min-height: 44px; border: 0; background: none; padding: 0 2px; font-family: inherit; font-size: 14px; color: #111111; cursor: pointer">Cancel</button>
      </div>

      <div style="flex: 1; overflow-y: auto; padding: 22px 16px 40px; box-sizing: border-box">
        <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 12px">
            <p style="margin: 0; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #595959">Trending now</p>
            <div style="display: flex; flex-direction: column; gap: 14px">
              <sc-for list="{{trending}}" as="p" hint-placeholder-count="3">
                <a href="#" style="display: flex; gap: 14px; text-decoration: none">
                  <img src="{{p.img}}" alt="{{p.name}}" style="width: 72px; height: 89px; object-fit: cover; display: block; flex: none">
                  <span style="display: flex; flex-direction: column; gap: 6px; padding-top: 2px">
                    <span style="font-family: 'Cormorant Garamond', serif; font-size: 16px; line-height: 21px">{{p.name}}</span>
                    <span style="font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px"><strong style="color: {{p.priceColor}}">{{p.price}}</strong><s style="color: #595959">{{p.was}}</s><span style="color: #595959">{{p.off}}</span></span>
                    <span style="font-size: 11px; color: #595959">{{p.colours}}</span>
                  </span>
                </a>
              </sc-for>
            </div>
            <p style="margin: 20px 0 0; border-top: 1px solid #E5E5E5; padding-top: 20px; display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #595959"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#595959" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M10 3c.6 3.9 2.6 5.9 6.5 6.5-3.9.6-5.9 2.6-6.5 6.5-.6-3.9-2.6-5.9-6.5-6.5C7.4 8.9 9.4 6.9 10 3z"/><path d="M18.5 14.5c.3 1.8 1.2 2.7 3 3-1.8.3-2.7 1.2-3 3-.3-1.8-1.2-2.7-3-3 1.8-.3 2.7-1.2 3-3z"/></svg>Contextual search</p>
            
            <p style="margin: 0; font-size: 13px; line-height: 19px; color: #4A4A4A"><b>Search the way you’d describe it.</b> The style, occasion, colour or budget, and we’ll find the match.</p>
            <p style="margin: 8px 0 0; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #595959">Try</p>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <sc-for list="{{examples}}" as="ex" hint-placeholder-count="4">
                <button type="button" onClick="{{ex.pick}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border: 1px solid #D6D6D6; background: #FFFFFF; text-align: left; font-family: 'Cormorant Garamond', serif; font-size: 16px; color: #111111; cursor: pointer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M10 3c.6 3.9 2.6 5.9 6.5 6.5-3.9.6-5.9 2.6-6.5 6.5-.6-3.9-2.6-5.9-6.5-6.5C7.4 8.9 9.4 6.9 10 3z"/></svg><span style="flex: 1">{{ex.text}}</span><span style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #595959">{{ex.tag}}</span></button>
              </sc-for>
            </div>
            <p style="margin: 16px 0 0; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #595959">Popular searches</p>
            <div style="display: flex; flex-direction: column; align-items: flex-start">
              <a href="#" style="display: flex; align-items: center; min-height: 36px; text-decoration: none; font-family: 'Cormorant Garamond', serif; font-size: 16px">Shoulder Bags</a>
              <a href="#" style="display: flex; align-items: center; min-height: 36px; text-decoration: none; font-family: 'Cormorant Garamond', serif; font-size: 16px">Tote Bags</a>
              <a href="#" style="display: flex; align-items: center; min-height: 36px; text-decoration: none; font-family: 'Cormorant Garamond', serif; font-size: 16px">Belt Bags</a>
              <a href="#" style="display: flex; align-items: center; min-height: 36px; text-decoration: none; font-family: 'Cormorant Garamond', serif; font-size: 16px">Shoes</a>
              <a href="#" style="display: flex; align-items: center; min-height: 36px; text-decoration: none; font-family: 'Cormorant Garamond', serif; font-size: 16px">Clothing</a>
            </div>
            <div style="display: flex; align-items: flex-start; gap: 12px; border-top: 1px solid #E5E5E5; margin-top: 10px; padding-top: 16px">
              <svg width="22" height="18.6" viewBox="0 0 26 22" fill="none" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M25 20.6C24.2 19.8 23.6 19.0667 23.1333 17.6667L23.0667 17.5333L23.1333 17.4C23.4 17 23.6 16.2667 23.6 15.6C23.6 13.6 23.6 12.3333 23.6 11C23.6 9.93332 23.6 8.99998 23.6 7.79998C23.4667 5.93332 22.2 4.26665 20.3333 3.39998C19.8 2.33332 19.1333 1.53332 18.2 0.999984C17.3333 0.46665 16.2 0.133317 15 0.0666504H7.13333C5.66667 0.199984 4.26667 0.799984 3.26667 1.66665C2.2 2.59998 1.6 3.86665 1.46667 5.13332C1.46667 6.39998 1.46667 7.33332 1.46667 8.39998C1.46667 9.59998 1.46667 10.9333 1.46667 13C1.46667 13.6667 1.66667 14.4 1.93333 14.8L2 14.8666V15C1.53333 16.4667 0.866667 17.1333 0.133333 17.9333L0 18.0667C1.46667 18.7333 3 18.6667 4.6 17.9333L4.8 17.8666C5.33333 18.8 6.13333 19.7333 7 20.4C7.86667 21 8.73333 21.4 9.4 21.4H18.2667C18.6 21.4 19.9333 21 20.1333 20.6667L20.2667 20.4667L20.4667 20.5333C22.1333 21.2667 23.6 21.3333 25.0667 20.6667L25 20.6ZM5.06667 17.3333C4.93333 17.2667 4.86667 17.2 4.8 17.1333C3.33333 17.8667 2.06667 17.8666 1.6 17.8666H1.06667V17.8L1.33333 17.4C1.93333 16.5333 2.46667 15.6 2.6 14.8666C2.26667 14.3333 2.06667 13.6 2.06667 12.8666C2.06667 10.8 2.06667 9.46665 2.06667 8.33332V8.26665C2.06667 7.19998 2.06667 6.33332 2.06667 5.06665C2.6 2.73332 4.26667 1.19998 7.13333 0.66665H15.0667C17.1333 0.799984 18.6667 1.73332 19.6 3.46665C19.6667 3.66665 19.7333 3.79998 19.8 3.93332C20.0667 4.53332 20.2667 5.13332 20.3333 5.73332L20.4667 12.6667C20.2667 14.4667 19.1333 15.8667 18.4667 16.4667C17.5333 17.4 16.4 18 15.6667 18L6.8 18.0667C6.53333 18.0667 5.86667 17.8 5.33333 17.5333C5.26667 17.4 5.2 17.4 5.06667 17.3333ZM23.4667 20.5333C22.9333 20.5333 21.7333 20.5333 20.2667 19.8C19.8 20.2 18.6667 20.7333 18.2667 20.7333L9.4 20.6667C8.66667 20.6667 7.33333 19.9333 6.13333 18.6L6.06667 18.5333H6.13333C6.46667 18.6667 6.73333 18.6667 6.8 18.6667H15.6667C17.6667 18.6667 20.9333 15.7333 21.0667 12.4V5.66665C21 5.19998 20.8667 4.79998 20.7333 4.39998V4.33332L20.8 4.39998C21.9333 5.19998 22.6667 6.33332 22.9333 7.73332C22.9333 8.99998 22.9333 9.93332 22.9333 10.9333C22.9333 12.0667 22.9333 13.4 22.9333 15.4667C22.9333 16.1333 22.7333 16.8667 22.4 17.4667C22.6 18.2 23.0667 19.2 23.6667 20L24 20.4667H23.4667V20.5333Z" fill="#111111" stroke="#111111" stroke-width="0.333333"/></svg>
              <div style="display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-size: 13px; line-height: 20px; color: #333333">Want to compare or narrow it down?</p><a href="#" style="align-self: flex-start; font-size: 13px; line-height: 20px; color: #111111; text-underline-offset: 3px">Ask COACH Shopping Assistant</a></div>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{hasVal}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 12px">
            <sc-if value="{{hasTags}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; flex-direction: column; gap: 10px; background: #F5F5F5; margin: 0 -16px; padding: 14px 16px">
                <p style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #595959"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#595959" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M10 3c.6 3.9 2.6 5.9 6.5 6.5-3.9.6-5.9 2.6-6.5 6.5-.6-3.9-2.6-5.9-6.5-6.5C7.4 8.9 9.4 6.9 10 3z"/><path d="M18.5 14.5c.3 1.8 1.2 2.7 3 3-1.8.3-2.7 1.2-3 3-.3-1.8-1.2-2.7-3-3 1.8-.3 2.7-1.2 3-3z"/></svg>We understood</p>
                <div class="hscroll" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px">
                  <sc-for list="{{tags}}" as="t" hint-placeholder-count="3">
                    <button type="button" onClick="{{t.remove}}" aria-label="Remove {{t.type}}: {{t.value}}" style="flex: none; display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px 0 12px; border: 1px solid #111111; background: #FFFFFF; font-family: inherit; font-size: 13px; color: #111111; white-space: nowrap; cursor: pointer"><span style="color: #595959">{{t.type}}</span>{{t.value}}<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
                  </sc-for>
                </div>
                <p style="margin: 0; font-size: 12px; color: #595959">Remove a tag to widen your results</p>
              </div>
            </sc-if>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px">
              <p style="margin: 0; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #595959">Top matches</p>
              <a href="#" style="display: flex; align-items: center; min-height: 36px; padding: 0 12px; border: 1px solid #111111; text-decoration: none; font-size: 11px; letter-spacing: 0.1em">VIEW ALL [N]</a>
            </div>
            <div style="display: flex; flex-direction: column; gap: 14px">
              <sc-for list="{{matches}}" as="p" hint-placeholder-count="3">
                <a href="#" style="display: flex; gap: 14px; text-decoration: none">
                  <img src="{{p.img}}" alt="{{p.name}}" style="width: 72px; height: 89px; object-fit: cover; display: block; flex: none">
                  <span style="display: flex; flex-direction: column; gap: 6px; padding-top: 2px">
                    <span style="font-family: 'Cormorant Garamond', serif; font-size: 16px; line-height: 21px">{{p.name}}</span>
                    <span style="font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px"><strong style="color: {{p.priceColor}}">{{p.price}}</strong><s style="color: #595959">{{p.was}}</s><span style="color: #595959">{{p.off}}</span></span>
                    <span style="font-size: 11px; color: #595959">{{p.colours}}</span>
                  </span>
                </a>
              </sc-for>
            </div>
            <p style="margin: 12px 0 0; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #595959">Suggestions</p>
            <div style="display: flex; flex-direction: column">
              <sc-for list="{{suggestions}}" as="sg" hint-placeholder-count="3">
                <a href="#" style="display: flex; align-items: center; min-height: 40px; text-decoration: none; font-family: 'Cormorant Garamond', serif; font-size: 16px">{{sg.base}}&#160;<strong>{{sg.more}}</strong></a>
              </sc-for>
