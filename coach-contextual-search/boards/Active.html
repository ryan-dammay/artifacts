<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COACH search · active state prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#555555}
input::placeholder{color:#595959;opacity:1}
.caret{display:inline-block;width:1px;height:16px;background:#111111;margin-left:2px;animation:caretblink 1s steps(1) infinite}
@keyframes caretblink{50%{opacity:0}}
@keyframes panelin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.panel{animation:panelin 180ms ease-out}
@media (prefers-reduced-motion: reduce){.caret,.panel{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
<style>html{background:#E9E9E9}body{margin:0}#stage{width:1440px;margin:0 auto}#root{width:1440px;height:940px;background:#FFFFFF;box-shadow:0 0 0 1px rgba(0,0,0,.06)}</style>
</head>
<body>
<div id="stage"><div id="root"></div></div>
<template id="tpl">
<div style="width: 1440px; height: 940px; box-sizing: border-box; background: #FFFFFF; color: #111111; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; flex-direction: column">

        <form role="search" onSubmit="{{submit}}" style="display: flex; align-items: center; gap: 8px; width: {{fieldW}}; border-bottom: {{fieldLine}}; padding: 6px 0 5px; transition: width 200ms ease">

            <input id="q2" value="{{val}}" onChange="{{onType}}" onFocus="{{open}}" onKeyDown="{{onKey}}" autocomplete="off" aria-expanded="{{isOpen}}" aria-description="Search by style, occasion, colour or budget" aria-controls="search-panel" style="width: 100%; border: 0; outline: 0; padding: 0; background: transparent; font-family: 'Cormorant Garamond', serif; font-size: 15px; color: #111111; caret-color: {{caretColor}}">
            <sc-if value="{{showAnim}}" hint-placeholder-val="{{ false }}">

            </sc-if>
            <sc-if value="{{showStatic}}" hint-placeholder-val="{{ true }}">
              <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; pointer-events: none; white-space: nowrap; overflow: hidden; font-family: 'Cormorant Garamond', serif; font-size: 15px; color: #949494"><span class="caret" style="margin: 0 3px 0 0; flex: none"></span><span style="overflow: hidden; text-overflow: ellipsis">Search the way you’d describe it</span></span>

          </div>

          </sc-if>
          <button type="submit" aria-label="Search" style="border: 0; background: none; padding: 0; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path></svg></button>
        </form>
